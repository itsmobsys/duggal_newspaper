name: Newsroom tick

# Keeps the autonomous newsroom moving even when the Render free instance has
# spun down. Every five minutes GitHub calls the signed worker endpoint, which
# wakes the API, leases any due jobs, catches up the edition and publishes.
#
# Required repository secrets:
#   API_BASE_URL       e.g. https://duggal-badmosh-api.onrender.com (no slash)
#   WORKER_TICK_TOKEN  must be byte-identical to the token on Render
#
# Without those secrets the job skips with a notice instead of failing, so a
# fresh clone or a fork does not show a red scheduled run. Scheduled runs on a
# fork cannot reach the production API anyway.
#
# Notes
# - GitHub's scheduled runs are best-effort and can be delayed under load.
# - Scheduled workflows are disabled after ~60 days without repository
#   activity. If the paper goes quiet, open the Actions tab and re-enable it.
# - The queue is lease-based and idempotent, so overlapping ticks are safe.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: newsroom-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the desk to file copy
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          WORKER_TICK_TOKEN: ${{ secrets.WORKER_TICK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL}" ] || [ -z "${WORKER_TICK_TOKEN}" ]; then
            echo "::notice title=Newsroom tick skipped::API_BASE_URL and WORKER_TICK_TOKEN are not set. Add both repository secrets so the schedule can wake the API. Until then the queue still drains whenever the site gets traffic."
            exit 0
          fi

          base="${API_BASE_URL%/}"
          url="${base}/internal/worker/tick?maxJobs=4"

          echo "Ticking ${base} ..."
          # Render free instances take ~30-60s to wake. --retry-all-errors covers
          # the cold-start 502/503 window without hammering the service.
          curl --silent --show-error --fail-with-body \
            --max-time 180 \
            --retry 4 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${WORKER_TICK_TOKEN}" \
            -H "Accept: application/json" \
            "${url}"
